[versions]
agp             = "8.7.3"
kotlin          = "2.1.0"
ksp             = "2.1.0-1.0.29"
compose-bom     = "2024.12.01"
room            = "2.6.1"
workmanager     = "2.10.0"
navigation      = "2.8.5"
lifecycle       = "2.8.7"
okhttp          = "4.12.0"
coil            = "2.7.0"
coroutines      = "1.9.0"
datastore       = "1.1.1"
vico            = "2.0.0-beta.2"
junit           = "4.13.2"

[libraries]
# Compose
compose-bom                  = { group = "androidx.compose",         name = "compose-bom",                   version.ref = "compose-bom" }
compose-ui                   = { group = "androidx.compose.ui",      name = "ui" }
compose-ui-graphics          = { group = "androidx.compose.ui",      name = "ui-graphics" }
compose-ui-tooling           = { group = "androidx.compose.ui",      name = "ui-tooling" }
compose-ui-tooling-preview   = { group = "androidx.compose.ui",      name = "ui-tooling-preview" }
compose-material3            = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons       = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-activity             = { group = "androidx.activity",         name = "activity-compose",              version = "1.9.3" }

# Navigation
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# Room
room-runtime  = { group = "androidx.room", name = "room-runtime",  version.ref = "room" }
room-ktx      = { group = "androidx.room", name = "room-ktx",      version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler",  version.ref = "room" }

# WorkManager
workmanager = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }

# Lifecycle
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose   = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",   version.ref = "lifecycle" }

# Networking
okhttp         = { group = "com.squareup.okhttp3", name = "okhttp",               version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor",  version.ref = "okhttp" }

# Images
coil = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# DataStore (substitui SharedPreferences para preferências de tema)
datastore = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Charts
vico-compose = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }

# Shimmer
shimmer = { group = "com.valentinilk.shimmer", name = "compose-shimmer", version = "1.3.1" }

# ML Kit Translation
mlkit-translate = { group = "com.google.mlkit", name = "translate", version = "17.0.3" }

# JSON
gson = { group = "com.google.code.gson", name = "gson", version = "2.10.1" }

# Coroutines
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

appcompat = { group = "androidx.appcompat", name = "appcompat", version = "1.7.0" }

# Testes
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application",                version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",           version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose",    version.ref = "kotlin" }
kotlin-parcelize    = { id = "org.jetbrains.kotlin.plugin.parcelize" }
ksp                 = { id = "com.google.devtools.ksp",                version.ref = "ksp" }
